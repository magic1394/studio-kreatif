<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumah Minimalis Modern — Gambar Interaktif 3D</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --line:#5cc8ff; --line-soft:rgba(92,200,255,.28); --ink:#d6efff; --dim:#7fa9c9;
    --accent:#ffd166; --panel:rgba(6,25,48,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{
    font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;color:var(--ink);overflow:hidden;
    background-color:#0a2744;
    background-image:
      linear-gradient(rgba(120,200,255,.11) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,200,255,.11) 1px,transparent 1px),
      linear-gradient(rgba(120,200,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,200,255,.05) 1px,transparent 1px);
    background-size:96px 96px,96px 96px,16px 16px,16px 16px;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{display:grid;height:100vh;grid-template-columns:292px minmax(0,1fr);
    grid-template-rows:46px minmax(0,1fr) auto;
    grid-template-areas:"head head" "left stage" "left bottom"}
  header{grid-area:head;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    border-bottom:1px solid var(--line-soft);background:var(--panel)}
  header h1{font-size:13px;letter-spacing:.16em;font-weight:600}
  header span{color:var(--dim);font-size:11px;letter-spacing:.08em}
  .left{grid-area:left;overflow-y:auto;padding:14px;border-right:1px solid var(--line-soft);background:var(--panel)}
  h3{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin-bottom:10px}
  .card{width:100%;text-align:left;border:1px solid var(--line-soft);background:rgba(10,50,90,.35);
    padding:10px;margin-bottom:10px;transition:.15s;display:block}
  .card:hover{border-color:var(--line)}
  .card.on{border-color:var(--line);background:rgba(40,120,190,.32);box-shadow:inset 0 0 0 1px var(--line)}
  .card svg{width:100%;height:64px;display:block;margin-bottom:6px}
  .card b{font-size:13px;letter-spacing:.1em}
  .card small{display:block;color:var(--dim);margin-top:2px;font-size:10.5px}
  .spec{width:100%;border-collapse:collapse;margin:6px 0 14px}
  .spec td{padding:5px 0;border-bottom:1px dashed var(--line-soft);font-size:11px}
  .spec td:last-child{text-align:right;color:var(--accent)}
  .notes{list-style:none}
  .notes li{font-size:11px;line-height:1.55;color:#b9dcf3;padding-left:14px;position:relative;margin-bottom:8px}
  .notes li::before{content:'▸';position:absolute;left:0;color:var(--line)}
  .stage{grid-area:stage;position:relative;min-height:0}
  .stage .mount{position:absolute;inset:0}
  .stage canvas{display:block;outline:none}
  .stage::after{content:'';position:absolute;inset:10px;border:1px dashed rgba(92,200,255,.22);pointer-events:none}
  .hud{position:absolute;pointer-events:none;inset:0}
  .hud > *{pointer-events:auto}
  .toolbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px 12px;align-items:center;
    background:var(--panel);border:1px solid var(--line-soft);padding:8px 14px;flex-wrap:wrap;justify-content:center;max-width:94%}
  .toolbar label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);white-space:nowrap}
  .toolbar input[type=range]{width:140px;accent-color:var(--line)}
  .btn{border:1px solid var(--line);background:rgba(40,120,190,.25);padding:5px 10px;font-size:11px;letter-spacing:.06em}
  .btn:hover{background:rgba(40,120,190,.5)}
  .btn.on{background:var(--line);color:#06223f;font-weight:600}
  .legend{position:absolute;top:104px;right:18px;background:var(--panel);border:1px solid var(--line-soft);padding:10px 12px;min-width:210px}
  .legend h3{margin-bottom:8px}
  .legend button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:3px 0;font-size:11px;width:100%;text-align:left}
  .legend i{width:9px;height:9px;border:1px solid;flex:none}
  .legend button.off{opacity:.35}
  .titleblock{position:absolute;right:18px;bottom:18px;border:1px solid var(--line-soft);background:var(--panel);
    font-size:10px;color:var(--dim);display:grid;grid-template-columns:auto auto;gap:2px 14px;padding:8px 10px}
  .titleblock b{color:var(--ink);font-weight:500;text-align:right}
  .hint{position:absolute;left:18px;bottom:18px;font-size:10px;color:var(--dim);letter-spacing:.06em}
  .bottom{grid-area:bottom;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    border-top:1px solid var(--line-soft);background:var(--panel)}
  .sec{padding:12px 14px;border-right:1px solid var(--line-soft)}
  .sec:last-child{border-right:0}
  .tiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tile{width:62px;border:1px solid var(--line-soft);background:none;padding:3px;font-size:10px;text-align:center}
  .tile .pv{height:34px;background-size:cover;background-position:center;margin-bottom:3px;border:1px solid rgba(0,0,0,.4)}
  .tile.on{border-color:var(--accent);color:var(--accent)}
  .lbl{font-size:10px;color:var(--dim);letter-spacing:.1em;margin:8px 0 5px}
  .sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sw button{width:22px;height:22px;border:1px solid rgba(255,255,255,.4)}
  .sw button.on{outline:2px solid var(--accent);outline-offset:1px}
  .sw input[type=color]{width:30px;height:24px;border:1px solid var(--line);background:none;padding:0}
  .sw code{font-size:10px;color:var(--dim)}
  @media (max-width:880px){
    body{overflow:auto}
    .app{height:auto;grid-template-columns:1fr;grid-template-rows:46px 70vh auto auto;
      grid-template-areas:"head" "stage" "left" "bottom"}
    .bottom{grid-template-columns:1fr}
    .sec{border-right:0;border-bottom:1px solid var(--line-soft)}
    .legend{top:auto;bottom:60px;right:10px}
    .titleblock,.hint{display:none}
  }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const TAU = Math.PI * 2;

/* =====================================================================
   DATA
   ===================================================================== */
const ROOF_TYPES = {
  pelana: {
    name: 'PELANA', sub: 'Massa putih tegas · tanpa overstek',
    specs: [['Lebar fasad', '± 10,4 m'], ['Tinggi total', '± 10,5 m'], ['Kemiringan', '± 39°'], ['Lantai', '2 lt + carport']],
    notes: [
      'Bidang atap berhenti persis di bidang fasad (tanpa overstek), jadi dua sisi miringnya terbaca sebagai siluet rumah yang bersih. Air hujan harus lewat talang tersembunyi di sisi samping.',
      'Kanopi hitam di atas balkon menjorok 1,4 m. Ia menahan sinar matahari rendah dan tampias hujan, sehingga kaca dan lantai kayu lebih awet.',
      'Balkon kantilever: pelat lantai 2 menerus dari dalam rumah ke luar. Bagian dalam pelat menahan momen ke arah sebaliknya, jadi carport di bawahnya tidak butuh tiang depan.'
    ]
  },
  miring: {
    name: 'MIRING', sub: 'Satu bidang · tinggi di sisi inti beton',
    specs: [['Lebar fasad', '± 10,4 m'], ['Tinggi total', '± 10,2 m'], ['Kemiringan', '± 18°'], ['Lantai', '2 lt + carport']],
    notes: [
      'Satu bidang miring berarti satu arah aliran air. Tidak ada bubungan yang harus dijaga dari bocor, jadi pengerjaannya lebih sederhana daripada pelana.',
      'Sisi tinggi menghadap inti beton di kanan, sisi rendah ke arah balkon. Selisih tinggi plafon kamar atas sekitar 2,1 m.',
      'Kanopi balkon tetap menjorok sama seperti tipe pelana, jadi fungsi penahan hujan dan matahari tidak berubah.'
    ]
  },
  datar: {
    name: 'DATAR', sub: 'Dak beton · parapet putih',
    specs: [['Lebar fasad', '± 10,4 m'], ['Tinggi total', '± 8,3 m'], ['Kemiringan', '1–2° (dak)'], ['Lantai', '2 lt + carport']],
    notes: [
      'Dak beton dibuat sedikit miring ke satu titik, lalu air keluar lewat pipa vertikal. Permukaan atasnya bisa dipakai jemuran atau taman atap.',
      'Tanpa bubungan, tepi atap hanya berupa parapet. Lapisan waterproofing jadi bagian paling kritis, karena kalau bocor langsung masuk ke plafon.',
      'Massa bangunan paling rendah di antara tiga tipe, jadi inti beton kanan (7 m) hampir sejajar dengan atap.'
    ]
  }
};
const PROFILES = {
  pelana: [[-1.64, 6.8], [4.8, 6.8], [4.8, 7.9], [1.58, 10.5], [-1.64, 7.9]],
  miring: [[-1.64, 6.8], [4.8, 6.8], [4.8, 10.2], [-1.64, 8.1]],
  datar:  [[-1.64, 6.8], [4.8, 6.8], [4.8, 8.3], [-1.64, 8.3]],
};

const LAYER_KEYS = ['tapak', 'bawah', 'slab', 'kaca', 'atas'];
const LAYER_COLORS = ['#a5f3a0', '#9be0ff', '#ffd166', '#c4a7ff', '#ff8fab'];
const LAYER_LABELS = {
  tapak: 'Tapak, Carport & Pohon', bawah: 'Volume Beton Lt. 1', slab: 'Pelat Lantai 2 & Balkon',
  kaca: 'Fasad Balkon, Kaca & Kanopi', atas: 'Volume Putih & Atap',
};
// Jarak angkat tiap layer (meter) saat exploded view = 100%
const EXPLODE_OFFSET = { tapak: 0, bawah: 1.2, slab: 3.4, kaca: 5.4, atas: 7.4 };

const PLASTER_KINDS = [{ id: 'halus', name: 'Halus' }, { id: 'kasar', name: 'Kasar' }, { id: 'sapu', name: 'Sapu' }];
const PLASTER_SWATCH = ['#f0eee9', '#e6dcc8', '#d4d4d0', '#c9d2bf', '#d9b9a0', '#8b8f93'];
const CON_MATS = [
  { id: 'beton', name: 'Beton', color: '#8f8f8b' }, { id: 'paras', name: 'Paras', color: '#8a8478' },
  { id: 'bata', name: 'Bata', color: '#a0553a' }, { id: 'plester', name: 'Plester', color: '#9d9d99' },
];
const CON_SWATCH = ['#8f8f8b', '#6f716f', '#a8a79f', '#8a8478', '#a0553a', '#5b5f63'];
const WOOD_MATS = [
  { id: 'jati', name: 'Jati', color: '#8f5d2c' }, { id: 'ulin', name: 'Ulin', color: '#4d311d' },
  { id: 'walnut', name: 'Walnut', color: '#5b3d2a' }, { id: 'pinus', name: 'Pinus', color: '#c9a36c' },
];
const WOOD_SWATCH = ['#8f5d2c', '#4d311d', '#5b3d2a', '#c9a36c', '#a77b4d', '#2c2019'];
const FRAME_SWATCH = ['#15171a', '#2f3438', '#4a3b2e', '#e8e6e0', '#1f3a5a'];

/* =====================================================================
   TEXTURE PROSEDURAL (canvas)
   ===================================================================== */
const rnd = (seed) => { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const mkCanvas = (s) => { const c = document.createElement('canvas'); c.width = c.height = s; return c; };
const shade = (hex, amt) => {
  const c = new THREE.Color(hex), h = {}; c.getHSL(h);
  c.setHSL(h.h, h.s, Math.min(1, Math.max(0, h.l + amt)));
  return '#' + c.getHexString();
};
const blotch = (g, x, y, r, rgb, a) => {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
};

function drawPlaster(kind, color) {
  const S = 256, c = mkCanvas(S), g = c.getContext('2d'), R = rnd(21 + kind.length);
  g.fillStyle = color; g.fillRect(0, 0, S, S);
  const kasar = kind === 'kasar';
  const n = kasar ? 5000 : 1800, a = kasar ? .1 : .05, sz = kasar ? 2.2 : 1.2;
  for (let i = 0; i < n; i++) {
    g.fillStyle = R() > .5 ? `rgba(0,0,0,${a * R()})` : `rgba(255,255,255,${a * R() * 1.4})`;
    g.fillRect(R() * S, R() * S, 1 + R() * sz, 1 + R() * sz);
  }
  if (kind === 'sapu') {
    g.lineWidth = 14;
    for (let i = 0; i < 26; i++) {
      g.strokeStyle = R() > .5 ? 'rgba(0,0,0,.035)' : 'rgba(255,255,255,.07)';
      g.beginPath(); g.arc(R() * S, R() * S, 30 + R() * 50, R() * TAU, R() * TAU); g.stroke();
    }
  } else {
    for (let i = 0; i < 14; i++) blotch(g, R() * S, R() * S, 30 + R() * 50, R() > .5 ? '0,0,0' : '255,255,255', .03 + R() * .04);
  }
  return c;
}

function drawConcrete(kind, color) {
  const S = 256, c = mkCanvas(S), g = c.getContext('2d'), R = rnd(31 + kind.length * 5);
  g.fillStyle = color; g.fillRect(0, 0, S, S);
  if (kind === 'paras') {
    g.fillStyle = shade(color, -.14); g.fillRect(0, 0, S, S);
    let y = 0;
    while (y < S) {
      const h = 38 + Math.floor(R() * 26); let x = -R() * 40;
      while (x < S) {
        const w = 56 + R() * 60;
        g.fillStyle = shade(color, (R() - .5) * .14); g.fillRect(x + 2, y + 2, w - 4, h - 4);
        g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x + 2, y + 2, w - 4, 3);
        for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(0,0,0,${R() * .12})`; g.fillRect(x + 2 + R() * (w - 4), y + 2 + R() * (h - 4), 2, 2); }
        x += w;
      }
      y += h;
    }
  } else if (kind === 'bata') {
    g.fillStyle = '#cfc8bb'; g.fillRect(0, 0, S, S);
    const rows = 12, bh = S / rows, bw = 64;
    for (let r = 0; r < rows; r++) for (let i = -1; i < 5; i++) {
      const x = i * bw + (r % 2 ? bw / 2 : 0);
      g.fillStyle = shade(color, (R() - .5) * .14); g.fillRect(x + 2, r * bh + 2, bw - 4, bh - 4);
      for (let k = 0; k < 8; k++) { g.fillStyle = `rgba(0,0,0,${R() * .12})`; g.fillRect(x + 2 + R() * (bw - 4), r * bh + 2 + R() * (bh - 4), 2, 2); }
    }
  } else {
    for (let i = 0; i < 70; i++) blotch(g, R() * S, R() * S, 20 + R() * 60, R() > .5 ? '0,0,0' : '255,255,255', .04 + R() * .06);
    const n = kind === 'plester' ? 5000 : 3000;
    for (let i = 0; i < n; i++) { g.fillStyle = R() > .5 ? `rgba(0,0,0,${R() * .1})` : `rgba(255,255,255,${R() * .12})`; g.fillRect(R() * S, R() * S, 1 + R() * 2, 1 + R() * 2); }
    if (kind === 'beton') {
      for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(0,0,0,${.15 + R() * .2})`; g.beginPath(); g.arc(R() * S, R() * S, .6 + R() * 1.2, 0, TAU); g.fill(); }
      g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, 1); g.lineTo(S, 1); g.moveTo(1, 0); g.lineTo(1, S); g.stroke();
      g.fillStyle = 'rgba(0,0,0,.45)';
      [[64, 64], [192, 64], [64, 192], [192, 192]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fill(); });
    }
  }
  return c;
}

function drawWood(kind, color) {
  const S = 256, c = mkCanvas(S), g = c.getContext('2d'), R = rnd(kind.length * 13 + 1);
  const P = { jati: [70, .16, 2], ulin: [120, .24, 1.6], walnut: [85, .18, 2], pinus: [50, .2, 3] }[kind] || [70, .16, 2];
  g.fillStyle = color; g.fillRect(0, 0, S, S);
  for (let i = 0; i < P[0]; i++) {
    const x = R() * S, amp = 2 + R() * 6, k = 1 + Math.floor(R() * 3), ph = R() * TAU, dark = R() > .45;
    g.strokeStyle = dark ? `rgba(0,0,0,${P[1] * (.3 + R())})` : `rgba(255,235,200,${P[1] * .5 * (.3 + R())})`;
    g.lineWidth = P[2] * (.4 + R());
    for (const off of [-S, 0, S]) {
      g.beginPath();
      for (let y = 0; y <= S; y += 8) { const xx = x + off + Math.sin(TAU * k * y / S + ph) * amp; y ? g.lineTo(xx, y) : g.moveTo(xx, y); }
      g.stroke();
    }
  }
  if (kind === 'pinus' || kind === 'jati') for (let n = 0; n < 2; n++) {
    const kx = R() * S, ky = R() * S;
    for (let r = 14; r > 2; r -= 3) { g.strokeStyle = `rgba(0,0,0,${.05 + (14 - r) * .012})`; g.lineWidth = 1.4; g.beginPath(); g.ellipse(kx, ky, r * .6, r * 1.5, 0, 0, TAU); g.stroke(); }
  }
  return c;
}

function drawSlab(color) {
  const S = 256, c = mkCanvas(S), g = c.getContext('2d'), R = rnd(77);
  g.fillStyle = color; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 40; i++) blotch(g, R() * S, R() * S, 25 + R() * 50, R() > .5 ? '0,0,0' : '255,255,255', .04 + R() * .05);
  for (let i = 0; i < 2500; i++) { g.fillStyle = R() > .5 ? `rgba(0,0,0,${R() * .08})` : `rgba(255,255,255,${R() * .1})`; g.fillRect(R() * S, R() * S, 1 + R() * 2, 1 + R() * 2); }
  g.strokeStyle = 'rgba(30,30,30,.55)'; g.lineWidth = 3;
  [0, 128].forEach(p => { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, S); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(S, p); g.stroke(); });
  return c;
}
function drawPaver(color) {
  const S = 256, c = mkCanvas(S), g = c.getContext('2d'), R = rnd(55);
  g.fillStyle = shade(color, -.1); g.fillRect(0, 0, S, S);
  for (let r = 0; r < 16; r++) for (let i = -1; i < 8; i++) {
    const x = i * 32 + (r % 2 ? 16 : 0);
    g.fillStyle = shade(color, (R() - .5) * .08); g.fillRect(x + 1, r * 16 + 1, 30, 14);
  }
  return c;
}
function drawWalk(color) {
  const S = 256, c = mkCanvas(S), g = c.getContext('2d'), R = rnd(66);
  g.fillStyle = shade(color, -.12); g.fillRect(0, 0, S, S);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = shade(color, (R() - .5) * .05); g.fillRect(i * 64 + 2, j * 64 + 2, 60, 60); }
  return c;
}
function drawGlow() {
  const c = mkCanvas(128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,236,190,1)'); gr.addColorStop(.35, 'rgba(255,214,150,.45)'); gr.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return c;
}
const makeTex = (canvas) => { const t = new THREE.CanvasTexture(canvas); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; };
function setMap(mat, canvas, rot) {
  if (mat.map) mat.map.dispose();
  const t = makeTex(canvas);
  if (rot) { t.center.set(.5, .5); t.rotation = Math.PI / 2; }
  mat.map = t; mat.needsUpdate = true;
}

/* =====================================================================
   GEOMETRI & KIT PEMBANTU
   ===================================================================== */
function boxGeo(w, h, d, tile = 2) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f * 4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);
  }
  return g;
}

function makeKit(layers, M) {
  const put = (L, o) => { (typeof L === 'string' ? layers[L] : L).add(o); return o; };
  const mesh = (L, geo, mat, shadow = true) => {
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = shadow; m.receiveShadow = true; m.userData.orig = mat; m.userData.cast = shadow;
    return put(L, m);
  };
  return {
    // Balok berdasarkan batas koordinat: x0,x1 · y0,y1 · z0,z1 (meter)
    B(L, mat, x0, x1, y0, y1, z0, z1, tile = 2, shadow = true) {
      const m = mesh(L, boxGeo(x1 - x0, y1 - y0, z1 - z0, tile), mat, shadow);
      m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); return m;
    },
    // Penampang (x,y) diekstrusi sepanjang sumbu z — dipakai untuk bentuk atap/fasad
    prism(L, mat, pts, z0, z1) {
      const s = new THREE.Shape(); pts.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y)));
      const g = new THREE.ExtrudeGeometry(s, { depth: z1 - z0, bevelEnabled: false });
      g.translate(0, 0, z0);
      const uv = g.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 2, uv.getY(i) / 2);
      return mesh(L, g, mat);
    },
    deck(L, mat, w, d, x, y, z, down = false) {
      const g = new THREE.PlaneGeometry(w, d), uv = g.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 2, uv.getY(i) * d / 2);
      const m = mesh(L, g, mat, false); m.rotation.x = down ? Math.PI / 2 : -Math.PI / 2; m.position.set(x, y, z); return m;
    },
    rod(L, p1, p2, r1, r2, mat) {
      const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
      const m = mesh(L, new THREE.CylinderGeometry(r2, r1, a.distanceTo(b), 8), mat);
      m.position.copy(a).add(b).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
      m.userData.noWire = true; return m;
    },
    blob(L, x, y, z, r, mat) {
      const m = mesh(L, new THREE.IcosahedronGeometry(r, 1), mat);
      m.position.set(x, y, z); m.scale.y = .85; m.userData.noWire = true; return m;
    },
    glow(L, x, y, z, sx, sy) {
      const s = new THREE.Sprite(M.glowMat); s.position.set(x, y, z); s.scale.set(sx, sy, 1); s.userData.lamp = true; return put(L, s);
    },
    light(L, x, y, z) {
      const l = new THREE.PointLight(0xffd9a0, 0, 8, 2); l.position.set(x, y, z); l.userData.lamp = true; return put(L, l);
    },
  };
}

/* =====================================================================
   MODEL RUMAH — koordinat dalam meter
   x: kiri(-) → kanan(+) · y: tinggi · z: belakang(-) → depan/jalan(+)
   ===================================================================== */
function buildTree(k, M) {
  const R = rnd(11), base = [-3.7, 0.85, 3.1], top = [-3.4, 6.7, 3.0];
  const at = t => base.map((v, i) => v + (top[i] - v) * t);
  k.rod('tapak', base, top, 0.17, 0.07, M.trunk);
  k.rod('tapak', at(.55), [-4.6, 7.6, 3.5], .08, .04, M.trunk);
  k.rod('tapak', at(.7), [-2.5, 8.0, 2.6], .07, .035, M.trunk);
  k.rod('tapak', at(.8), [-3.6, 8.9, 3.6], .06, .03, M.trunk);
  for (let i = 0; i < 18; i++) {
    const cx = -3.5 + (R() - .5) * 3.8, cy = 6.9 + R() * 3.0, cz = 3.1 + (R() - .5) * 3.0;
    k.blob('tapak', cx, cy, cz, .75 + R() * .6, M.leaves[i % 3]);
  }
}

function buildHouse(k, M, type) {
  const PX = 4.8; // sisi kanan volume putih

  /* ---- TAPAK ---- */
  k.B('tapak', M.driveway, -6.5, 7, -0.15, 0, 0, 6);
  k.B('tapak', M.driveway, -4.2, 0.1, -0.15, 0, -5, 0);
  k.B('tapak', M.sidewalk, -9, 10, -0.15, 0, 6, 7.4);
  k.B('tapak', M.street, -9, 10, -0.15, 0, 7.4, 14);
  k.B('tapak', M.concrete, -5.4, -2.0, 0, 0.85, 2.4, 3.9);          // planter beton
  k.B('tapak', M.soil, -5.3, -2.1, 0.8, 0.87, 2.5, 3.8, 1, false);
  buildTree(k, M);

  /* ---- BAWAH: volume beton lantai 1 + inti kanan ---- */
  k.B('bawah', M.concrete, 0.1, PX, 0, 3.2, -7, 0);                  // blok beton depan
  k.B('bawah', M.concrete, -4.2, 0.1, 0, 3.2, -7, -5);               // dinding belakang carport
  k.B('bawah', M.concrete, -4.2, -3.9, 0, 3.2, -0.3, 0);             // kolom carport
  k.B('bawah', M.concrete, PX, 6.2, 0, 7.0, -7, -1.0);               // inti kanan (lebih tinggi)
  k.B('bawah', M.plaster, 5.95, 6.2, 0, 7.0, -1.0, -0.92);           // kolom putih
  k.B('bawah', M.plaster, PX, 6.3, 7.0, 7.15, -7, -0.9);             // dak putih
  k.B('bawah', M.frame, 4.95, 5.8, 0, 3.1, -1.0, -0.97);             // latar pintu lamela
  for (let i = 0; i < 10; i++) k.B('bawah', M.wood, 4.97 + i * 0.083, 4.97 + i * 0.083 + 0.06, 0, 3.1, -0.97, -0.92);
  k.B('bawah', M.wood, -2.5, -1.5, 0, 2.5, -5.0, -4.95);             // pintu masuk dari carport
  k.B('bawah', M.frame, -2.55, -1.45, 2.5, 2.56, -5.0, -4.94, 1);
  k.B('bawah', M.frame, 0.75, 0.95, 2.25, 2.45, 0, 0.03, 1);         // nomor rumah
  k.glow('bawah', 3.0, 2.8, 0.15, 2.2, 1.9);

  /* ---- SLAB: pelat lantai 2 + balkon kantilever ---- */
  k.B('slab', M.concrete, -4.2, PX, 3.2, 3.5, -7, 0);
  k.B('slab', M.frame, -3.1, 1.5, 3.0, 3.5, 0, 1.4);                 // sisi depan balkon (hitam)
  k.deck('slab', M.woodH, 4.6, 3.4, -0.8, 3.505, -0.3);              // lantai kayu balkon
  k.glow('slab', -2.0, 3.1, -2.2, 2.6, 1.3);                         // lampu plafon carport

  /* ---- KACA: fasad balkon, kanopi, railing ---- */
  k.B('kaca', M.frame, -3.1, 1.5, 6.45, 6.8, -7, 1.4);               // kanopi hitam
  k.deck('kaca', M.woodH, 4.6, 3.4, -0.8, 6.445, -0.3, true);        // plafon kayu kanopi
  k.B('kaca', M.concrete, -3.1, -1.64, 3.5, 6.45, -7, -2.0);         // dinding abu sisi kiri
  k.B('kaca', M.plaster, -1.64, 1.5, 3.5, 6.45, -7, -2.6);           // blok di belakang jendela
  k.B('kaca', M.interior, -1.64, 1.5, 3.5, 6.45, -2.6, -2.3);        // interior gelap
  k.B('kaca', M.curtain, 1.0, 1.45, 3.55, 6.4, -2.25, -2.1, 1, false);
  k.B('kaca', M.frame, -1.64, 1.5, 6.38, 6.45, -2.04, -1.96, 1);     // kusen jendela
  k.B('kaca', M.frame, -1.64, 1.5, 3.5, 3.58, -2.04, -1.96, 1);
  [-1.64, -0.08, 1.44].forEach(x => k.B('kaca', M.frame, x, x + 0.06, 3.5, 6.45, -2.04, -1.96, 1));
  k.B('kaca', M.glass, -1.64, 1.5, 3.58, 6.38, -2.01, -1.99, 2, false);
  // railing kaca (depan, kiri, kanan) + handrail + tiang
  k.B('kaca', M.glass, -3.05, 1.45, 3.6, 4.55, 1.33, 1.35, 2, false);
  k.B('kaca', M.glass, -3.07, -3.05, 3.6, 4.55, -2.0, 1.35, 2, false);
  k.B('kaca', M.glass, 1.45, 1.47, 3.6, 4.55, 0, 1.35, 2, false);
  k.B('kaca', M.frame, -3.1, 1.5, 4.55, 4.62, 1.30, 1.40, 1);
  k.B('kaca', M.frame, -3.12, -3.02, 4.55, 4.62, -2.0, 1.4, 1);
  k.B('kaca', M.frame, 1.42, 1.52, 4.55, 4.62, 0, 1.4, 1);
  k.B('kaca', M.frame, -3.12, -3.04, 3.5, 4.62, 1.32, 1.4, 1);
  k.B('kaca', M.frame, 1.42, 1.5, 3.5, 4.62, 1.32, 1.4, 1);

  /* ---- ATAS: volume putih + bentuk atap + lampu dinding ---- */
  k.B('atas', M.plaster, 1.5, PX, 3.5, 6.8, -7, 0);
  k.prism('atas', M.plaster, PROFILES[type], -7, 0);
  [2.24, 3.9].forEach(x => {
    k.B('atas', M.frame, x - .06, x + .06, 5.2, 5.6, 0, .1, 1);
    k.glow('atas', x, 6.0, .2, 1.4, 2.0);
    k.glow('atas', x, 4.8, .2, 1.4, 2.0);
    k.light('atas', x, 5.4, .8);
  });
}

/* =====================================================================
   VIEWPORT (Three.js)
   ===================================================================== */
function Viewport(props) {
  const mountRef = useRef(null);
  const P = useRef(props); P.current = props;
  const T = useRef({});

  // --- inisialisasi sekali ---
  useEffect(() => {
    const mount = mountRef.current;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 400);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 6; controls.maxDistance = 110; controls.maxPolarAngle = Math.PI * 0.495;
    controls.autoRotateSpeed = 1.4;

    // Cahaya
    const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x1a2a3a, 0.75); scene.add(hemi);
    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
    const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
    sun.position.set(10, 24, 9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 100 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0006; scene.add(sun);

    // Bidang bayangan + grid blueprint
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.ShadowMaterial({ opacity: 0.3 }));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.16; ground.receiveShadow = true; scene.add(ground);
    const gridGroup = new THREE.Group();
    const grid = new THREE.GridHelper(80, 80, 0x6fd0ff, 0x2b6ea0);
    grid.position.y = -0.16; grid.material.transparent = true; grid.material.opacity = 0.35; gridGroup.add(grid);
    [14, 22, 32].forEach(r => {
      const pts = []; for (let i = 0; i <= 128; i++) pts.push(new THREE.Vector3(Math.cos(i / 128 * TAU) * r, -0.15, Math.sin(i / 128 * TAU) * r));
      gridGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x5cc8ff, transparent: true, opacity: 0.3 })));
    });
    scene.add(gridGroup);

    // Material bersama
    const mk = (o) => new THREE.MeshStandardMaterial(o);
    const M = {
      plaster: mk({ color: 0xffffff, roughness: .92 }),
      concrete: mk({ color: 0xffffff, roughness: .95 }),
      wood: mk({ color: 0xffffff, roughness: .7 }),
      woodH: mk({ color: 0xffffff, roughness: .7 }),
      frame: mk({ color: '#15171a', roughness: .55, metalness: .2 }),
      glass: mk({ color: 0xaacbdc, transparent: true, opacity: .26, roughness: .05, metalness: .1, side: THREE.DoubleSide, depthWrite: false }),
      interior: mk({ color: '#3b2a1f', roughness: .9, emissive: 0x2a1a0e }),
      curtain: mk({ color: '#e9dfcd', roughness: 1, side: THREE.DoubleSide }),
      soil: mk({ color: '#2b2118', roughness: 1 }),
      trunk: mk({ color: '#5b4632', roughness: .95 }),
      leaves: ['#5f8f3d', '#78a64a', '#4d7a33'].map(c => mk({ color: c, roughness: .9, flatShading: true })),
      driveway: mk({ color: 0xffffff, roughness: .9 }),
      sidewalk: mk({ color: 0xffffff, roughness: .9 }),
      street: mk({ color: 0xffffff, roughness: .95 }),
      ghost: new THREE.MeshBasicMaterial({ color: 0x0f4c81, transparent: true, opacity: .28, side: THREE.DoubleSide, depthWrite: false }),
      edge: new THREE.LineBasicMaterial({ color: 0x9fe3ff }),
    };
    M.glowMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(drawGlow()), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .55 });
    setMap(M.driveway, drawSlab('#9b9a95')); setMap(M.sidewalk, drawWalk('#b3b0a8')); setMap(M.street, drawPaver('#4a4a4c'));

    // Layer
    const house = new THREE.Group(); scene.add(house);
    const layers = {};
    LAYER_KEYS.forEach(key => { layers[key] = new THREE.Group(); house.add(layers[key]); });
    const kit = makeKit(layers, M);
    const S = { e: 0 };

    T.current = {
      M, layers, house, sun, hemi,
      build(type) {
        LAYER_KEYS.forEach(key => {
          const L = layers[key];
          while (L.children.length) {
            const c = L.children[0]; L.remove(c);
            c.traverse(o => { if (o.geometry && !o.isSprite) o.geometry.dispose(); });
          }
        });
        buildHouse(kit, M, type);
      },
      applyWire() {
        const w = P.current.wire;
        house.traverse(o => {
          if (!o.isMesh || o.userData.noWire) return;
          if (!o.userData.edges) {
            const l = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 28), M.edge);
            l.visible = false; o.add(l); o.userData.edges = l;
          }
          o.material = w ? M.ghost : o.userData.orig;
          o.userData.edges.visible = w; o.castShadow = w ? false : o.userData.cast;
        });
      },
      reset() {
        const s = 1 + 0.8 * S.e;
        controls.target.set(0, 5.2 + S.e * 3.8, 0);
        camera.position.copy(controls.target).add(new THREE.Vector3(12, 3.2, 26).multiplyScalar(s));
        controls.update();
      },
    };
    T.current.reset();

    const resize = () => {
      const w = mount.clientWidth, h = mount.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(resize); ro.observe(mount); resize();

    let raf;
    const loop = () => {
      raf = requestAnimationFrame(loop);
      const p = P.current, prev = S.e;
      S.e += (p.explode - S.e) * 0.07;
      if (Math.abs(p.explode - S.e) < 0.0005) S.e = p.explode;
      const e = S.e;
      LAYER_KEYS.forEach(key => { layers[key].position.y = e * EXPLODE_OFFSET[key]; });
      // kamera ikut naik & mundur supaya semua layer tetap masuk frame
      const ty = 5.2 + e * 3.8, dy = ty - controls.target.y;
      controls.target.y = ty; camera.position.y += dy;
      const sNew = 1 + 0.8 * e, sOld = 1 + 0.8 * prev;
      if (sNew !== sOld) {
        const off = camera.position.clone().sub(controls.target).multiplyScalar(sNew / sOld);
        camera.position.copy(controls.target).add(off);
      }
      controls.autoRotate = p.autoRotate;
      gridGroup.visible = p.grid;
      controls.update(); renderer.render(scene, camera);
    };
    loop();

    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); controls.dispose(); renderer.dispose();
      if (renderer.domElement.parentNode === mount) mount.removeChild(renderer.domElement);
    };
  }, []);

  // --- material ---
  useEffect(() => { const M = T.current.M; if (M) setMap(M.plaster, drawPlaster(props.plasterKind, props.plasterColor)); }, [props.plasterKind, props.plasterColor]);
  useEffect(() => { const M = T.current.M; if (M) setMap(M.concrete, drawConcrete(props.conKind, props.conColor)); }, [props.conKind, props.conColor]);
  useEffect(() => {
    const M = T.current.M; if (!M) return;
    const cv = drawWood(props.woodKind, props.woodColor);
    setMap(M.wood, cv); setMap(M.woodH, cv, true);
  }, [props.woodKind, props.woodColor]);
  useEffect(() => { const M = T.current.M; if (M) M.frame.color.set(props.frameColor); }, [props.frameColor]);

  // --- bangun ulang model saat tipe atap berubah (harus sebelum efek lampu & wire) ---
  useEffect(() => { T.current.build(props.roofType); T.current.applyWire(); }, [props.roofType]);
  useEffect(() => { T.current.applyWire(); }, [props.wire]);
  useEffect(() => { LAYER_KEYS.forEach(k => { T.current.layers[k].visible = props.layerVis[k]; }); }, [props.layerVis]);

  // --- siang / senja ---
  useEffect(() => {
    const t = T.current; if (!t.sun) return;
    const d = props.dusk;
    t.sun.color.set(d ? 0xff9a5c : 0xfff1d6); t.sun.intensity = d ? .85 : .95;
    t.sun.position.set(d ? -16 : 10, d ? 9 : 24, d ? 20 : 9);
    t.hemi.color.set(d ? 0xffcfa0 : 0xcfe8ff); t.hemi.groundColor.set(d ? 0x1a1020 : 0x1a2a3a); t.hemi.intensity = d ? .42 : .75;
  }, [props.dusk]);

  // --- lampu dinding ---
  useEffect(() => {
    const t = T.current; if (!t.house) return;
    const on = props.lamp && !props.wire;
    t.M.glowMat.opacity = props.dusk ? 1 : .55;
    t.house.traverse(o => { if (o.userData.lamp) { o.visible = on; if (o.isLight) o.intensity = props.dusk ? 1.6 : .7; } });
  }, [props.lamp, props.wire, props.dusk, props.roofType]);

  useEffect(() => { T.current.reset && T.current.reset(); }, [props.resetKey]);

  return <div className="mount" ref={mountRef} />;
}

        ))}
        <h3 style={{ marginTop: 16 }}>SPESIFIKASI</h3>
        <table className="spec"><tbody>
          {info.specs.map(([a, b]) => <tr key={a}><td>{a}</td><td>{b}</td></tr>)}
        </tbody></table>
        <h3>CARA KERJA STRUKTUR</h3>
        <ul className="notes">{info.notes.map((n, i) => <li key={i}>{n}</li>)}</ul>
      </aside>

      {/* CANVAS 3D */}
      <main className="stage">
        <Viewport {...{ roofType, plasterKind, plasterColor, conKind, conColor, woodKind, woodColor, frameColor, explode, autoRotate, wire, grid, lamp, dusk, layerVis, resetKey }} />
        <div className="hud">
          <div className="toolbar">
            <label>EXPLODED
              <input type="range" min="0" max="100" value={Math.round(explode * 100)} onChange={e => setExplode(e.target.value / 100)} />
              {Math.round(explode * 100)}%
            </label>
            <button className="btn" onClick={() => setExplode(explode > 0.5 ? 0 : 1)}>{explode > 0.5 ? 'RAKIT' : 'BONGKAR'}</button>
            <button className={'btn' + (autoRotate ? ' on' : '')} onClick={() => setAutoRotate(!autoRotate)}>PUTAR OTOMATIS</button>
            <button className={'btn' + (wire ? ' on' : '')} onClick={() => setWire(!wire)}>MODE BLUEPRINT</button>
            <button className={'btn' + (lamp ? ' on' : '')} onClick={() => setLamp(!lamp)}>LAMPU</button>
            <button className={'btn' + (dusk ? ' on' : '')} onClick={() => setDusk(!dusk)}>{dusk ? 'SENJA' : 'SIANG'}</button>
            <button className={'btn' + (grid ? ' on' : '')} onClick={() => setGrid(!grid)}>GRID</button>
            <button className="btn" onClick={() => setResetKey(resetKey + 1)}>RESET VIEW</button>
          </div>
          <div className="legend">
            <h3>LAYER</h3>
            {LAYER_KEYS.map((k, i) => (
              <button key={k} className={layerVis[k] ? '' : 'off'} onClick={() => setLayerVis({ ...layerVis, [k]: !layerVis[k] })}>
                <i style={{ borderColor: LAYER_COLORS[i], background: layerVis[k] ? LAYER_COLORS[i] : 'transparent' }} />
                {LAYER_LABELS[k]}
              </button>
            ))}
          </div>
          <div className="titleblock">
            <span>ATAP</span><b>{info.name}</b>
            <span>PLESTER</span><b>{PLASTER_KINDS.find(m => m.id === plasterKind).name.toUpperCase()}</b>
            <span>BAWAH</span><b>{CON_MATS.find(m => m.id === conKind).name.toUpperCase()}</b>
            <span>KAYU</span><b>{WOOD_MATS.find(m => m.id === woodKind).name.toUpperCase()}</b>
          </div>
          <div className="hint">KLIK-KIRI PUTAR · KLIK-KANAN GESER · SCROLL ZOOM</div>
        </div>
      </main>

      {/* PANEL BAWAH */}
      <section className="bottom">
        <div className="sec">
          <h3>02 · PLESTER DINDING ATAS</h3>
          <Tiles items={PLASTER_KINDS} value={plasterKind} previews={plasterPv} onPick={m => setPlasterKind(m.id)} />
          <Swatches colors={PLASTER_SWATCH} value={plasterColor} onPick={setPlasterColor} />
        </div>
        <div className="sec">
          <h3>03 · DINDING BAWAH</h3>
          <Tiles items={CON_MATS} value={conKind} previews={conPv} onPick={m => { setConKind(m.id); setConColor(m.color); }} />
          <Swatches colors={CON_SWATCH} value={conColor} onPick={setConColor} />
        </div>
        <div className="sec">
          <h3>04 · KAYU & RANGKA</h3>
          <Tiles items={WOOD_MATS} value={woodKind} previews={woodPv} onPick={m => { setWoodKind(m.id); setWoodColor(m.color); }} />
          <Swatches colors={WOOD_SWATCH} value={woodColor} onPick={setWoodColor} />
          <div className="lbl">WARNA RANGKA, KANOPI & RAILING</div>
          <Swatches colors={FRAME_SWATCH} value={frameColor} onPick={setFrameColor} />
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
